[package]
name = "cineforge"
version = "0.1.0"
description = "CineForge — cinematic video generation desktop app"
authors = ["Christopher Gordon Phillips <info@lumenhelix.com>"]
license = "MIT"
repository = "https://github.com/LumenHelixLab/cineFORGE"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-store = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "process", "io-util"] }
portpicker = "0.1"
once_cell = "1.20"
log = "0.4"
env_logger = "0.11"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

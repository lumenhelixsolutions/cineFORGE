[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cineforge"
version = "0.1.0"
description = "Local desktop app that turns source documents into cinematic videos"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Christopher Gordon Phillips", email = "info@lumenhelix.com"}
]
keywords = ["video", "ai", "llm", "veo", "storyboard", "cinematic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "litellm>=1.52.0",
    "txtai>=8.1.0",
    "sentence-transformers>=3.3.0",
    "moviepy>=2.0.0",
    "pymupdf>=1.24.0",
    "markdownify>=0.13.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.17",
    "aiofiles>=24.1.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.122.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12",
]

[project.optional-dependencies]
vertex = ["google-genai>=0.8.0"]
fal = ["fal-client>=0.5.0"]
local = ["diffusers>=0.31.0", "torch>=2.4.0", "accelerate>=1.0.0"]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "hypothesis>=6.122.0", "mypy>=1.13.0", "ruff>=0.8.0", "pytest-playwright>=0.5.0", "playwright>=1.40.0"]

[project.entry-points."cineforge.adapters.video"]
"vertex.veo" = "backend.adapters.video.vertex_veo:VertexVeoAdapter"
"fal.aggregator" = "backend.adapters.video.fal_adapter:FalAdapter"
"wan2gp.local" = "backend.adapters.video.wan2gp:Wan2GPAdapter"
"comfyui.local" = "backend.adapters.video.comfyui:ComfyUIAdapter"
"framepack.local" = "backend.adapters.video.framepack:FramePackAdapter"
"cogvideo.local" = "backend.adapters.video.cogvideox:CogVideoXAdapter"
"rife.local" = "backend.adapters.video.rife:RIFEAdapter"
"realesrgan.local" = "backend.adapters.video.realesrgan:RealESRGANAdapter"
"openai.sora" = "backend.adapters.video.sora_adapter:SoraAdapter"
"kling.3.0" = "backend.adapters.video.kling_adapter:KlingAdapter"
"luma.dream-machine" = "backend.adapters.video.luma_adapter:LumaAdapter"

[project.entry-points."cineforge.adapters.llm"]
"litellm" = "backend.adapters.llm.litellm_director:LiteLLMDirector"

[project.entry-points."cineforge.adapters.embedder"]
"local.bge-small" = "backend.adapters.embedder.local_bge:LocalEmbedder"

[project.entry-points."cineforge.adapters.tts"]
"piper.local" = "backend.adapters.tts.piper:PiperTTS"

[project.entry-points."cineforge.adapters.refimg"]
"fal.flux" = "backend.adapters.refimg.fal_flux:FalFluxAdapter"
"local.diffusers" = "backend.adapters.refimg.local_diffusers:LocalDiffusersAdapter"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/", "ui/", "src-tauri/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
markers = [
    "e2e: End-to-end tests requiring a browser",
]
